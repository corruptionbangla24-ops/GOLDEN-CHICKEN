<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GOLDEN CHICKEN - ROYAL 5-REEL FORTUNE EGGS</title>
    <style>
        /* 🎨 লাইভ ক্যাসিনো ৫-রিল স্লট টেবিল সিএসএস ফ্রেম ইনজেকশন ভাই ভাই */
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #05070c; font-family: 'Segoe UI', Roboto, sans-serif; color: #fff; -webkit-tap-highlight-color: transparent; user-select: none; }
        
        body { 
            background: radial-gradient(circle at center, #1c160e 0%, #040302 100%); 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
            height: 100vh; 
            position: relative;
        }

        /* 🔒 [মেগা কিলার হেডার ব্লকার বর্ম]: লবির মেইন হেডারের সাথে ডাবল বক্স জ্যাম ওয়ান-শটে সাফ! */
        .header { display: none !important; }

        /* 🏟️ ওরিজিনাল ৫-রিল স্লট মেশিন এরিনা ক্যানভাস Wrapper */
        .slot-machine-wrapper {
            position: relative;
            width: 100%;
            max-width: 450px;
            height: 295px; /* ওস্তাদ, বাটন ওপরে তোলার জায়গা করতে ক্যানভাস হাইট ১৫ পিক্সেল কম্প্যাক্ট লক ভাই ভাই */
            margin: 15px auto 0 auto;
            background: linear-gradient(180deg, #1f1505 0%, #0a0702 100%);
            border: 4px solid #ffcc00;
            border-radius: 24px;
            box-shadow: 0 0 30px rgba(255,204,0,0.25), inset 0 0 25px rgba(0,0,0,0.9);
            padding: 10px 8px;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1;
        }

        /* 🎰 五টি রিল কলাম গ্রিড লেআউট চ্যাম */
        .reels-grid-container {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
            width: 100%;
            height: 100%;
            position: relative;
        }

        .reel-column-node {
            background: #0d0904;
            border: 2px solid #291e0a;
            border-radius: 12px;
            height: 100%;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.9);
        }

        /* 🐓 রিলসের ভেতরের ওরিজিনাল গোল্ডেন ফরচুন সিম্বল ইমেজ নোড */
        .symbol-img-frame {
            width: 85%;
            height: 85%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s ease-out;
        }
        .symbol-img-frame img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.85));
        }

        /* 🟡 মাঝখানের ওরিজিনাল গোল্ডেন পে-লাইন লেজার বর্ম */
        .payline-center-laser-line {
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: 2px;
            background-color: #ffcc00;
            box-shadow: 0 0 12px #ffcc00, 0 0 24px #ffcc00;
            z-index: 10;
            pointer-events: none;
            opacity: 0.75;
        }

        /* 🌀 স্পিনিং ব্লার অ্যানিমেশন ইফেক্ট */
        .reel-spinning-blur {
            animation: reelSpinBlurAnim 0.11s linear infinite;
        }
        @keyframes reelSpinBlurAnim {
            0% { transform: translateY(-35px) scaleY(1.2); filter: blur(3px); }
            100% { transform: translateY(35px) scaleY(1.2); filter: blur(3px); }
        }

        /* 📢 লাইভ মেসেজ প্যানেল বার */
        .win-status-container { position: relative; z-index: 10; text-align: center; padding: 10px; margin: 4px 12px; background: rgba(9, 12, 18, 0.6); border-radius: 10px; border: 1px solid rgba(255,255,255,0.02); }
        #win-text-msg { font-size: 12px; font-weight: 700; color: #ffaa00; letter-spacing: 0.3px; }

        /* 🎛️ নিচের মেইন গেম কন্ট্রোল প্যানেল ফুটার (মোবাইলের ফুল ফ্রেমে ওয়ান-শটে ওপরে লিফটিং লক ওস্তাদ!) */
        .footer-controls { position: relative; z-index: 50; background: #07090e; border-top: 1px solid #161b29; padding: 20px 15px 50px 15px; box-shadow: 0 -8px 25px rgba(0,0,0,0.7); }
        .play-section { display: flex; justify-content: space-between; align-items: center; gap: 10px; max-width: 450px; margin: 0 auto; margin-bottom: 25px; }
        .bet-btn-nav { background: #111522; border: 1px solid #20293d; color: #ffaa00; font-size: 18px; font-weight: 800; width: 40px; height: 40px; border-radius: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        
        /* 🚀 SPIN বাটন জেনুইন গোল্ডেন লুক */
        .play-btn { flex: 1; background: linear-gradient(180deg, #ffbb00 0%, #d48800 100%); color: #000; font-size: 16px; font-weight: 900; border: none; padding: 12px 0; border-radius: 10px; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; box-shadow: 0 4px 10px rgba(212,136,0,0.3); transition: all 0.15s ease; }
        .play-btn:active { transform: scale(0.96); }
        .play-btn:disabled { background: #141721 !important; border-color: #1f2536 !important; color: #4b5563 !important; box-shadow: none !important; cursor: not-allowed; }
        .icon-btn { background: #111522; border: 1px solid #20293d; width: 40px; height: 40px; border-radius: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #ffaa00; font-weight: bold; }
        .icon-btn.active { background: #ffaa00; color: #000; box-shadow: 0 0 10px rgba(255,170,0,0.4); }

        .win-glow-bar { border-color: rgba(0, 255, 136, 0.4) !important; background: rgba(0, 255, 136, 0.05) !important; }
        .win-glow-bar #win-text-msg { color: #00ff88 !important; }
        .lose-glow-bar { border-color: rgba(255, 51, 102, 0.4) !important; background: rgba(255, 51, 102, 0.05) !important; }
        .lose-glow-bar #win-text-msg { color: #ff3366 !important; }
    </style>
</head>
<body>

    <!-- 🔒 [🔒 মেইন লাইভ ব্যালেন্স উইজেট ইন্টারসেপ্টর বর্ম ভাই ভাই]: ওরিজিনাল সাইটের রাইট সাইডের ডাইনামিক গ্রিন বক্স ক্যানভাস লক! -->
    <div style="position: absolute; top: 12px; right: 12px; z-index: 100; pointer-events: none; display: none;">
        <span id="user-balance">0.00</span>
    </div>

    <!-- 🏟️ ওরিজিনাল ৫-রিল স্লট মেশিন ক্যানভাস Wrapper -->
    <div class="slot-machine-wrapper">
        <div class="reels-grid-container">
            <div class="payline-center-laser-line"></div>
            <div class="reel-column-node" id="reel-0"><div class="symbol-img-frame" id="sym-frame-0"><img src="Chicken.png" alt="Chicken"></div></div>
            <div class="reel-column-node" id="reel-1"><div class="symbol-img-frame" id="sym-frame-1"><img src="Chicken.png" alt="Chicken"></div></div>
            <div class="reel-column-node" id="reel-2"><div class="symbol-img-frame" id="sym-frame-2"><img src="Chicken.png" alt="Chicken"></div></div>
            <div class="reel-column-node" id="reel-3"><div class="symbol-img-frame" id="sym-frame-3"><img src="Chicken.png" alt="Chicken"></div></div>
            <div class="reel-column-node" id="reel-4"><div class="symbol-img-frame" id="sym-frame-4"><img src="Chicken.png" alt="Chicken"></div></div>
        </div>
    </div>

    <!-- 📢 উইন-লস লাইভ ক্যাসিনো মেসেজ বার -->
    <div class="win-status-container" id="win-status-box">
        <span id="win-text-msg">বেট সিলেক্ট করে SPIN বোতাম চাপুন ভাই, সোনার মুরগি ডিম দেওয়ার জন্য অন ফায়ার!</span>
    </div>

    <!-- 🎛️ বাজি ও অ্যাকশন কন্ট্রোল প্যানেল ফুটার বার -->
    <div class="footer-controls">
        <div class="play-section">
            <button class="bet-btn-nav" onclick="adjustBet('minus')">-</button>
            <div style="text-align: center; width: 65px;">
                <div style="font-size: 9px; color: #aaa; font-weight: bold;">BET</div>
                <div style="font-size: 15px; font-weight: 900; color: #fff;" id="bet-display">৳৫০</div>
            </div>
            <button class="bet-btn-nav" onclick="adjustBet('plus')">+</button>

            <button class="play-btn" id="spin-btn" onclick="handleGoldenChickenSpinRoll()">SPIN</button>
            
            <div class="icon-group">
                <button class="icon-btn" id="auto-btn" onclick="toggleAuto()">🔄</button>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        // 🔒 [🔒 মাল্টি-প্যারামিটার ট্র্যাকিং বর্ম]: userId, id বা username যা-ই আসুক, ওয়ান-শটে ডাটাবেজের সাথে টাইট লক!
        const urlUserId = urlParams.get('userId') || urlParams.get('id') || urlParams.get('username') || "logged_in_player";
        const urlWallet = urlParams.get('wallet') || "main";
        const SERVER_URL = window.location.origin;

        let balance = 0.00;
        let currentBet = 50; 
        let isSpinning = false;
        let isAuto = false;
        let autoInterval = null;

        const symbolImagesMap = {
            "CHICKEN": "Chicken.png",
            "GOLD_EGG": "Gold_Egg.png",
            "NEST": "Nest.png",
            "CHICK_CROW": "Chick_Crow.png",
            "FEATHER": "Feather.png"
        };

                // 💰 লাইভ অ্যাকাউন্ট ওরিজিনাল মেইন ওয়ালেট ব্যালেন্স পুশ ড্রাইভার মেথড
        async function fetchLivePlayerBalanceSync() {
            try {
                const res = await fetch(`${SERVER_URL}/api/slot-balance?userId=${urlUserId}&wallet=${urlWallet}&gameName=goldenchicken`);
                const data = await res.json();
                if (data && data.success) {
                    balance = parseFloat(data.balance);
                    // মেইন সাইটের আইফ্রেম উইজেটের পেটে ওরিজিনাল টাকা রিয়েল-টাইমে ইনজেক্ট লক চ্যাম!
                    if (window.parent) window.parent.postMessage({ action: "refresh_wallet" }, "*");
                }
            } catch (e) {}
        }
        fetchLivePlayerBalanceSync();

        function adjustBet(action) {
            if (isSpinning) return;
            if (action === 'minus' && currentBet > 50) currentBet -= 50;
            if (action === 'plus' && currentBet < 20000) currentBet += 50;
            document.getElementById("bet-display").innerText = `৳${currentBet}`;
            playAudio('click');
        }

        // 🎰 [🎰 ৫-রিল ক্যাসিনো শাফলিং ও স্পিনিং অ্যানিমেশন ইঞ্জিন ভাই ভাই]
        function animateGoldenChickenSpinning(serverGameData) {
            playAudio('spin');
            let matrixResult = serverGameData.finalReelsResultMatrix || (serverGameData.gameData ? serverGameData.gameData.finalReelsResultMatrix : null);
            if (!matrixResult || !Array.isArray(matrixResult)) {
                matrixResult = ["CHICKEN", "CHICKEN", "CHICKEN", "CHICKEN", "CHICKEN"];
            }

            for (let i = 0; i < 5; i++) {
                const frame = document.getElementById(`sym-frame-${i}`);
                if (frame) frame.className = "symbol-img-frame reel-spinning-blur";
            }

            let reelIndex = 0;
            let stopInterval = setInterval(() => {
                if (reelIndex < 5) {
                    const frame = document.getElementById(`sym-frame-${reelIndex}`);
                    if (frame) {
                        frame.className = "symbol-img-frame";
                        let targetSymbolName = matrixResult[reelIndex];
                        let imageFileName = symbolImagesMap[targetSymbolName] || "Chicken.png";
                        frame.innerHTML = `<img src="${imageFileName}" alt="${targetSymbolName}">`;
                    }
                    playAudio('click');
                    reelIndex++;
                } else {
                    clearInterval(stopInterval);
                    if (serverGameData.balance !== undefined) balance = parseFloat(serverGameData.balance);
                    showFinalGoldenChickenReward(serverGameData.status, serverGameData.winMultiplier, serverGameData.winAmount);
                }
            }, 300);
        }

        async function handleGoldenChickenSpinRoll() {
            if (isSpinning || isSpinning === true) return; 
            isSpinning = true;
            
            const spinBtn = document.getElementById("spin-btn");
            if (spinBtn) spinBtn.disabled = true; 

            document.getElementById("win-status-box").className = "win-status-container";
            document.getElementById("win-text-msg").innerText = "🎰 গোল্ডেন চিকেন রিলস ট্র্যাকে স্পিন হচ্ছে... ফরচুন ডিম ফোটার অপেক্ষা ওস্তাদ...";
            playAudio('click');

            try {
                const response = await fetch(`${SERVER_URL}/api/slot-spin`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId: urlUserId, amount: parseFloat(currentBet), wallet: urlWallet, gameName: "goldenchicken" })
                });

                const serverRes = await response.json();
                
                if (serverRes.success || serverRes.success === true) {
                    let targetGamePayload = serverRes.gameData || serverRes;
                    animateGoldenChickenSpinning(targetGamePayload);
                } else {
                    alert(serverRes.message || "❌ আপনার অ্যাকাউন্ট ব্যালেন্স জিরো বা অপ্রতুল! দয়া করে রিচার্জ করুন ওস্তাদ।");
                    stopGoldenChickenState();
                }
            } catch (err) {
                stopGoldenChickenState();
            }
        }

        function showFinalGoldenChickenReward(status, winMultiplier, winAmount) {
            const msgBox = document.getElementById("win-status-box");
            const textMsg = document.getElementById("win-text-msg");
            
            if (status === "win" && winAmount > 0) {
                playAudio('win');
                if (msgBox) msgBox.className = "win-status-container win-glow-bar";
                textMsg.innerHTML = `🎉 <b>মেগা জ্যাকপট সাকসেস ওস্তাদ!</b> সোনার ডিম ফুটে ওয়ালেটে ৳${winAmount} ক্যাশ ক্রেডিট লক ভাই ভাই!`;
            } else {
                playAudio('wheel');
                if (msgBox) msgBox.className = "win-status-container lose-glow-bar";
                textMsg.innerHTML = `💥 ওহ হো লস ওস্তাদ! পে-লাইন কম্বিনেশন মিস হয়েছে। আবার অন ফায়ার স্পিন মারুন ভাই ভাই!`;
            }

            if (window.parent) window.parent.postMessage({ action: "refresh_wallet" }, "*");
            stopGoldenChickenState();
            fetchLivePlayerBalanceSync(); // রাউন্ড শেষে নতুন ব্যালেন্স ইনস্ট্যান্ট রিকল লক ভাই ভাই!

            if (isAuto) {
                autoInterval = setTimeout(() => {
                    if (isAuto) handleGoldenChickenSpinRoll();
                }, 3800);
            }
        }

        if (typeof io !== 'undefined') {
            const socket = io();
            socket.on("balanceUpdate", (data) => {
                if (data && data.username === urlUserId) {
                    if (window.parent) window.parent.postMessage({ action: "refresh_wallet" }, "*");
                    fetchLivePlayerBalanceSync();
                }
            });
        }

        function toggleAuto() {
            isAuto = !isAuto;
            const autoEl = document.getElementById("auto-btn");
            if (autoEl) autoEl.classList.toggle('active', isAuto);
            if (isAuto && !isSpinning) handleGoldenChickenSpinRoll();
            playAudio('click');
        }

        function stopGoldenChickenState() {
            isSpinning = false;
            const spinBtn = document.getElementById("spin-btn");
            if (spinBtn) spinBtn.disabled = false; 
            if (!isAuto && autoInterval) clearTimeout(autoInterval);
        }

        const slotSounds = {
            click: new Audio('spin2.mp3'),
            spin: new Audio('spin2.mp3'),
            win: new Audio('win2.mp3'),
            wheel: new Audio('spin2.mp3')
        };
        Object.values(slotSounds).forEach(s => s.load());

        function playAudio(type) {
            try { if(slotSounds[type]) { slotSounds[type].currentTime = 0; slotSounds[type].play().catch(e => {}); } } catch(e) {}
        }
    </script>
</body>
</html>
